name: materialize-lockfile
on:
  push:
    branches: [main]
    paths:
      - ".github/lockfile-parts/**"
      - ".github/workflows/materialize-lockfile.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct package-lock.json
        run: |
          python3 <<'PY'
          from pathlib import Path
          import gzip, base64, hashlib, sys
          parts_dir = Path(".github/lockfile-parts")
          patches = []
          patch_file = parts_dir / "patches.txt"
          if patch_file.exists():
              for line in patch_file.read_text().splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  part, idx, ch = line.split(" ")
                  patches.append((part, int(idx), ch))
          chunks = []
          for i in range(20):
              name = f"{i:02d}"
              p = parts_dir / name
              if not p.exists():
                  sys.exit(f"missing {p}")
              data = bytearray(p.read_bytes())
              for part, idx, ch in patches:
                  if part == name:
                      data[idx] = ord(ch)
              chunks.append(bytes(data))
          raw = gzip.decompress(base64.b64decode(b"".join(chunks)))
          assert len(raw) == 305630, len(raw)
          h = hashlib.sha256(raw).hexdigest()
          assert h == "f88a13849015270b113fb6787e2a1ddab28e9ce2414d352ad120d516a765167b", h
          Path("package-lock.json").write_bytes(raw)
          print("wrote", len(raw), h)
          PY
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "no lockfile change"
            exit 0
          fi
          git commit -m "chore: materialize package-lock.json"
          git push
